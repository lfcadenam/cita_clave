server {
    listen 80;
    listen [::]:80;
    server_name cita-clave.nuvex-tecnologia.com _;

    client_max_body_size 35M;
    charset utf-8;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Seguridad HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Resolver interno de Docker para resolución dinámica de DNS
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Archivos públicos de Storage (Comprobantes, imágenes de salones)
    location ^~ /storage/ {
        alias /var/www/backend/public/storage/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Recursos estáticos de Laravel/Filament (CSS, JS, fuentes, imágenes, favicons)
    location ~* ^/(css|js|fonts|images|favicon\.png|favicon\.ico) {
        root /var/www/backend/public;
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Filament SuperAdmin, Admin, Livewire, API y Healthcheck (/up) -> PHP-FPM directo
    location ~ ^/(superadmin|admin|api|livewire|up)(/|$) {
        root /var/www/backend/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $upstream_backend app:9000;
        fastcgi_pass $upstream_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Cualquier petición directa a archivos .php
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        set $upstream_backend app:9000;
        fastcgi_pass $upstream_backend;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Portal de clientes Angular SPA
    location / {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

    location @frontend {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

    # Proteger archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}