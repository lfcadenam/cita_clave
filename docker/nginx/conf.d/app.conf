server {
    listen 80;
    listen [::]:80;
    server_name cita-clave.nuvex-tecnologia.com _;

    root /var/www/frontend;
    index index.html;

    client_max_body_size 35M;
    charset utf-8;

    # Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Seguridad HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Archivos públicos de Storage (Comprobantes, imágenes de salones)
    location ^~ /storage/ {
        alias /var/www/backend/public/storage/;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Recursos estáticos de marca / backend (logos, css, temas)
    location ~* ^/(css|images|favicon\.png|favicon\.ico) {
        root /var/www/backend/public;
        try_files $uri @frontend;
        access_log off;
        expires 7d;
    }

    # Filament SuperAdmin, Admin, Livewire, API y Healthcheck (/up)
    location ~ ^/(superadmin|admin|api|livewire|up)(/|$) {
        root /var/www/backend/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass app:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 300;
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }
    }

    # Portal de clientes Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location @frontend {
        root /var/www/frontend;
        try_files $uri $uri/ /index.html;
    }

    # Proteger archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}