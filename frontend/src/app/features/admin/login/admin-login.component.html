<div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 sm:p-6 relative overflow-hidden select-none">
  
  <!-- Elementos decorativos sutiles de fondo (Nuvex Modern Curve Ambient) -->
  <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full bg-emerald-200/30 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -left-40 w-96 h-96 rounded-full bg-teal-200/30 blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10 flex flex-col gap-6">
    
    <!-- Encabezado de Marca Oficial CitaClave -->
    <div class="text-center flex flex-col items-center">
      
      <!-- Logo Oficial CitaClave -->
      <div class="p-3 rounded-2xl bg-white/80 backdrop-blur-md border border-slate-200/80 shadow-xs inline-flex items-center justify-center mb-3">
        <img 
          src="/assets/brand/citaclave-logo.png" 
          alt="CitaClave" 
          class="h-9 sm:h-10 w-auto object-contain" 
        />
      </div>

      <!-- Insignia de Portal -->
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 text-[11px] font-bold border border-emerald-200/80 shadow-2xs">
        <span class="w-2 h-2 rounded-full bg-[#00C975] animate-pulse"></span>
        <span>Portal Administrativo</span>
      </div>

      <p class="text-xs text-slate-500 font-medium mt-2">
        Ingreso exclusivo para gestión de agenda, citas y salón
      </p>

    </div>

    <!-- Tarjeta Elevada de Inicio de Sesión (Nuvex Modern Curve UI) -->
    <div class="bg-white rounded-[32px] p-6 sm:p-8 border border-slate-200/90 shadow-xl shadow-slate-200/50 flex flex-col gap-6">
      
      <div class="pb-2 border-b border-slate-100">
        <h2 class="text-lg font-bold text-slate-900 tracking-tight">Iniciar Sesión</h2>
        <p class="text-xs text-slate-400 mt-0.5">Ingresa tus credenciales de acceso seguras</p>
      </div>

      <!-- Alerta de Error -->
      @if (errorMessage()) {
        <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-semibold flex items-start gap-2.5 animate-in fade-in duration-200">
          <svg class="w-4 h-4 text-rose-600 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <span class="leading-relaxed">{{ errorMessage() }}</span>
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        
        <!-- Campo: Correo Electrónico -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">
            Correo Electrónico
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
              </svg>
            </span>
            <input 
              type="email" 
              name="email"
              [ngModel]="email()"
              (ngModelChange)="email.set($event)"
              required
              class="w-full pl-10 pr-4 py-2.5 rounded-2xl text-xs bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00C975] focus:bg-white transition-all font-medium"
              placeholder="admin@ejemplo.com"
            />
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">
            Contraseña
          </label>
          <div class="relative">
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </span>
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              name="password"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)"
              required
              class="w-full pl-10 pr-10 py-2.5 rounded-2xl text-xs bg-slate-50 border border-slate-200 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#00C975] focus:bg-white transition-all font-medium"
              placeholder="••••••••••••"
            />
            <button 
              type="button"
              (click)="toggleShowPassword()"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors cursor-pointer"
              [title]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
            >
              @if (showPassword()) {
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              } @else {
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Botón de Envío -->
        <button 
          type="submit" 
          [disabled]="isLoading()"
          class="w-full mt-2 py-3 px-4 rounded-2xl bg-[#00C975] hover:bg-[#00b067] text-white font-bold text-xs sm:text-sm shadow-md shadow-emerald-600/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer"
        >
          @if (isLoading()) {
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Autenticando...</span>
          } @else {
            <span>Ingresar al Panel de Control</span>
          }
        </button>

        <!-- Accesos Rápidos de Credenciales para Desarrollo / Demo -->
        <div class="flex items-center justify-center gap-2 pt-1 text-[11px]">
          <button 
            type="button" 
            (click)="setCredentials('paola@nuvex-belleza.com', 'Paola2026!*')"
            class="px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 transition-colors font-medium cursor-pointer"
          >
            Administradora
          </button>
          <span class="text-slate-300">•</span>
          <button 
            type="button" 
            (click)="setCredentials('citaclave@gmail.com', 'Admin2026!*')"
            class="px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-emerald-50 text-slate-600 hover:text-emerald-700 transition-colors font-medium cursor-pointer"
          >
            Super Administrador
          </button>
        </div>

      </form>

      <!-- Pie de Seguridad -->
      <div class="pt-4 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400 font-medium">
          Conexión cifrada de alta seguridad • CitaClave
        </p>
      </div>

    </div>

    <!-- Sub-pie de Marca -->
    <div class="text-center">
      <span class="text-[11px] text-slate-400 font-medium">
        Tecnología desarrollada por Nuvex Suite
      </span>
    </div>

  </div>
</div>
